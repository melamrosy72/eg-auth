server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    # text/html is always included. API JSON is left uncompressed (tiny responses).
    gzip_types text/css application/javascript image/svg+xml;

    # Security headers live in the SPA locations only: add_header in a location
    # disables inheritance, and /api/ must keep Helmet's headers without duplicates.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        # The style-src hash allows the one <style> sonner injects on import (sonner is pinned
        # exactly; src/csp.test.ts fails if the hash no longer matches).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'sha256-StEaX+se6YS7pqjzrzMIA0KaX9zF/8zAhvQXZAe5epY='; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Vite emits content-hashed file names under /assets/. Missing files 404
    # instead of falling back to index.html with a year-long cache.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Docker's DNS. A variable in proxy_pass makes Nginx re-resolve `server` at
    # request time, so a recreated server container (new IP) is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # No URI part after the upstream, so /api/... reaches the server unchanged.
    location /api/ {
        set $api_upstream http://server:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
