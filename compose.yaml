services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Local dev and tests only; not reachable from other machines.
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # busybox wget from node:22-alpine; /api/health also pings Mongo.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/easygen_auth
      FRONTEND_ORIGINS: http://localhost:8080
      # Local HTTP only. Behind HTTPS this must be true.
      COOKIE_SECURE: "false"
      # Nginx is the one proxy in front of the server.
      TRUST_PROXY_HOPS: "1"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo-data:
