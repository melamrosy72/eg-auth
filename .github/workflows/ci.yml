name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration-test setup refuses any database whose name doesn't end in _test.
      MONGODB_URI: mongodb://localhost:27017/easygen_auth_test
      # CI-only dummy values; not secrets.
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789-abcdefghij
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789-abcdefghij
      FRONTEND_ORIGINS: http://localhost:5173
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install the npm pinned in package.json
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install the npm pinned in package.json
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: [server, client]
    runs-on: ubuntu-latest
    env:
      # Dummy values so compose.yaml's ${JWT_*:?} checks pass. Images are not pushed.
      JWT_ACCESS_SECRET: ci-only-access-secret-0123456789-abcdefghij
      JWT_REFRESH_SECRET: ci-only-refresh-secret-0123456789-abcdefghij
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
